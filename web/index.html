<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="رياض الأذكار - Mawlid, Baith, Swalath, Dua and Ratib">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="رياض الأذكار">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>رياض الأذكار</title>
  <link rel="manifest" href="manifest.json">
</head>
<body style="margin:0;background:#061c32">
  <!-- Visible while Flutter downloads/initializes; removed on first frame. -->
  <div id="startup" role="status" aria-live="polite" style="position:fixed;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;background:#061c32;color:#fff;z-index:9999;font:14px Arial,sans-serif">
    <div dir="rtl" style="color:#ffe4a2;font-size:30px;margin-bottom:16px">رياض الأذكار</div>
    <div style="width:30px;height:30px;border:3px solid #ffffff40;border-top-color:#ffe4a2;border-radius:50%;animation:rotate 0.9s linear infinite"></div>
    <p id="loading-text" style="margin-top:16px">Opening Riyadul Adkar...</p>
    <button id="restart" onclick="location.reload()" style="display:none;padding:10px 22px;border:1px solid #ffe4a2;color:#ffe4a2;background:transparent;border-radius:9px;cursor:pointer">Retry</button>
  </div>
  <style>@keyframes rotate{to{transform:rotate(360deg)}}</style>
  <script>
    window.addEventListener('flutter-first-frame', function () {
      var splash = document.getElementById('startup');
      if (splash) splash.remove();
    });
    window.setTimeout(function () {
      var splash = document.getElementById('startup');
      if (!splash) return;
      document.getElementById('loading-text').textContent =
        'The app is taking longer than expected. Please retry or check your connection.';
      document.getElementById('restart').style.display = 'block';
    }, 30000);
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
