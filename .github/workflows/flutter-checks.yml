name: Flutter checks

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: al_auradu
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Install dependencies
        run: flutter pub get
      - name: Analyze Dart source
        run: flutter analyze --no-fatal-infos
      - name: Run Flutter tests
        run: flutter test
      - name: Verify Flutter web release build
        run: flutter build web --release
      - name: Smoke-test the fast static preview payload
        run: |
          test -s build/web/index.html
          test -s build/web/main.dart.js
          python3 -m http.server 3000 --bind 127.0.0.1 --directory build/web > /tmp/aurad-web.log 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT
          curl --fail --retry 15 --retry-delay 1 --retry-connrefused http://127.0.0.1:3000/ -o /tmp/aurad-home.html
          curl --fail --silent http://127.0.0.1:3000/main.dart.js -o /dev/null
