name: One-time Saadha Vector Title

on:
  push:
    branches:
      - feature/saadha-sharp-fast-clean-badge
    paths:
      - .github/workflows/vectorize-saadha-heading.yml

permissions:
  contents: write

jobs:
  keep-original-arabic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install deterministic PDF/vector tools
        run: python -m pip install --disable-pip-version-check PyMuPDF==1.26.5 numpy==2.2.6 Pillow==11.3.0 opencv-python-headless==4.12.0.88 cairosvg==2.8.2
      - name: Trace original Arabic heading only; verify text unchanged
        run: python al_auradu/tool/vectorize_saadha_heading.py
      - name: Commit optimized PDF only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add al_auradu/assets/books/swalathus_saadha.pdf
          if ! git diff --cached --quiet; then
            git commit -m "Replace pixelated Saadha heading with faithful scalable outlines"
            git push origin HEAD:feature/saadha-sharp-fast-clean-badge
          fi
