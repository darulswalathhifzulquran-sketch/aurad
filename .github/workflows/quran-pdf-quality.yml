name: Quran PDF Source Audit

on:
  push:
    branches:
      - feature/quran-pdf-reader-604
    paths:
      - .github/workflows/quran-pdf-quality.yml
      - al_auradu/tool/audit_quran_pdf.py
      - al_auradu/quran.pdf
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect-original-mushaf:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install PDF structural reader
        run: python -m pip install --disable-pip-version-check PyMuPDF==1.26.5
      - name: Verify original PDF and report text/image-based clarity
        run: python al_auradu/tool/audit_quran_pdf.py
