name: al_auradu
description: Riyad al-Adhkar - Mawlid, Baith, Swalath, Dua collection.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  shared_preferences: ^2.2.2
  url_launcher: ^6.2.5
  pdfrx: ^2.10.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/data/
    - assets/quran/
    - assets/pages/
    - assets/images/
    - assets/books/
    - quran.pdf # original PDF already tracked via Git LFS; do not duplicate
  fonts:
    - family: ArabicFont
      fonts:
        - asset: assets/fonts/arabic.ttf
          weight: 700
